// ══════════════════════════════════════════
// CANVAS ART
// ══════════════════════════════════════════

function drawArtDefault(canvas) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');

  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.62);
  skyGrad.addColorStop(0,   '#06021a');
  skyGrad.addColorStop(0.5, '#0d0530');
  skyGrad.addColorStop(1,   '#1e0838');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.62);

  // Ground
  const gndGrad = ctx.createLinearGradient(0, H * 0.62, 0, H);
  gndGrad.addColorStop(0, '#040c05');
  gndGrad.addColorStop(1, '#010301');
  ctx.fillStyle = gndGrad;
  ctx.fillRect(0, H * 0.62, W, H * 0.38);

  // Stars (deterministic)
  for (let i = 0; i < 80; i++) {
    const x = ((i * 2654435761 + 1234567) % 65536) / 65536 * W;
    const y = ((i * 1013904223 + 7654321) % 65536) / 65536 * H * 0.5;
    const r = (i % 5 === 0) ? 1.1 : 0.55;
    ctx.globalAlpha = 0.4 + (i % 3) * 0.25;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Sun
  const sunX = W * 0.5, sunY = H * 0.61;
  const sunR = Math.min(W, H) * 0.22;

  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
  sunGrad.addColorStop(0,    '#FFE566');
  sunGrad.addColorStop(0.35, '#FF7A20');
  sunGrad.addColorStop(0.72, '#C9084A');
  sunGrad.addColorStop(1,    'rgba(140,0,70,0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  ctx.fill();

  // Sun stripe mask
  ctx.save();
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 0.98, 0, Math.PI * 2);
  ctx.clip();
  const stripes = 9;
  for (let i = 0; i < stripes; i++) {
    const ty = sunY - sunR + (i / stripes) * sunR * 2;
    const thick = 1.5 + i * 0.9;
    ctx.fillStyle = 'rgba(5, 1, 20, 0.92)';
    ctx.fillRect(sunX - sunR, ty + 1.5, sunR * 2, thick);
  }
  ctx.restore();

  // Sun halo glow
  const haloGrad = ctx.createRadialGradient(sunX, sunY, sunR * 0.5, sunX, sunY, sunR * 2.4);
  haloGrad.addColorStop(0, 'rgba(180,30,90,0.18)');
  haloGrad.addColorStop(0.5, 'rgba(100,10,50,0.08)');
  haloGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = haloGrad;
  ctx.fillRect(0, 0, W, H);

  // Mountains
  const horizon = H * 0.62;
  ctx.fillStyle = '#030806';

  // Left mountain cluster
  ctx.beginPath();
  ctx.moveTo(-W * 0.05, horizon);
  ctx.lineTo(W * 0.12,  H * 0.28);
  ctx.lineTo(W * 0.27,  H * 0.44);
  ctx.lineTo(W * 0.38,  horizon);
  ctx.fill();

  // Center peak
  ctx.beginPath();
  ctx.moveTo(W * 0.30, horizon);
  ctx.lineTo(W * 0.50, H * 0.35);
  ctx.lineTo(W * 0.70, horizon);
  ctx.fill();

  // Right mountain cluster
  ctx.beginPath();
  ctx.moveTo(W * 0.62, horizon);
  ctx.lineTo(W * 0.76, H * 0.30);
  ctx.lineTo(W * 0.90, H * 0.44);
  ctx.lineTo(W * 1.05, horizon);
  ctx.fill();

  // Mountain glow edges (lime)
  ctx.save();
  ctx.shadowColor = '#4AFF3F';
  ctx.shadowBlur  = 5;
  ctx.strokeStyle = 'rgba(74,255,63,0.55)';
  ctx.lineWidth   = 1;

  ctx.beginPath();
  ctx.moveTo(-W * 0.05, horizon);
  ctx.lineTo(W * 0.12,  H * 0.28);
  ctx.lineTo(W * 0.27,  H * 0.44);
  ctx.lineTo(W * 0.38,  horizon);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W * 0.30, horizon);
  ctx.lineTo(W * 0.50, H * 0.35);
  ctx.lineTo(W * 0.70, horizon);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W * 0.62, horizon);
  ctx.lineTo(W * 0.76, H * 0.30);
  ctx.lineTo(W * 0.90, H * 0.44);
  ctx.lineTo(W * 1.05, horizon);
  ctx.stroke();
  ctx.restore();

  // Perspective grid (ground)
  const vX = W * 0.5, vY = horizon;
  ctx.lineWidth = 0.7;

  // Vertical lines (radiating)
  const numV = 14;
  for (let i = 0; i <= numV; i++) {
    const t = i / numV;
    ctx.strokeStyle = `rgba(78,189,201,${0.1 + t * 0.15})`;
    ctx.beginPath();
    ctx.moveTo(vX, vY);
    ctx.lineTo(i / numV * W, H);
    ctx.stroke();
  }

  // Horizontal lines (perspective spacing)
  const numH = 8;
  for (let j = 1; j <= numH; j++) {
    const t  = Math.pow(j / numH, 1.6);
    const y  = vY + t * (H - vY);
    const xl = vX + (0 - vX) * t;
    const xr = vX + (W - vX) * t;
    ctx.strokeStyle = `rgba(78,189,201,${0.12 + t * 0.22})`;
    ctx.beginPath();
    ctx.moveTo(xl, y); ctx.lineTo(xr, y);
    ctx.stroke();
  }

  // Horizon line (brightest grid line)
  ctx.strokeStyle = 'rgba(78,189,201,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, horizon); ctx.lineTo(W, horizon);
  ctx.stroke();

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y = 0; y < H; y += 2) {
    ctx.fillRect(0, y, W, 1);
  }

  // Vignette
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.82);
  vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
  vigGrad.addColorStop(1, 'rgba(0,0,0,0.68)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawArtNature(canvas) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  sky.addColorStop(0, '#060b0e'); sky.addColorStop(0.6, '#0a1218'); sky.addColorStop(1, '#0e1a12');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.65);
  const gnd = ctx.createLinearGradient(0, H * 0.65, 0, H);
  gnd.addColorStop(0, '#0a1a0c'); gnd.addColorStop(1, '#030805');
  ctx.fillStyle = gnd; ctx.fillRect(0, H * 0.65, W, H * 0.35);
  // Moon
  const mX = W * 0.72, mY = H * 0.22, mR = Math.min(W,H)*0.1;
  const halo = ctx.createRadialGradient(mX,mY,0,mX,mY,mR*3.5);
  halo.addColorStop(0,'rgba(180,230,160,.12)'); halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=halo; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#cce8b4'; ctx.beginPath(); ctx.arc(mX,mY,mR,0,Math.PI*2); ctx.fill();
  [[.3,-.2,.2],[-.25,.15,.12],[.1,.3,.08]].forEach(([dx,dy,r])=>{ ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.arc(mX+dx*mR,mY+dy*mR,r*mR,0,Math.PI*2); ctx.fill(); });
  // Stars
  for(let i=0;i<50;i++){
    const x=((i*2654435761+987654)%65536)/65536*W, y=((i*1013904223+3141592)%65536)/65536*H*.55;
    ctx.globalAlpha=.2+(i%4)*.2; ctx.fillStyle='#c8f0b0'; ctx.beginPath(); ctx.arc(x,y,i%7===0?.9:.45,0,Math.PI*2); ctx.fill();
  } ctx.globalAlpha=1;
  // Trees
  const drawTree=(x,base,w,h)=>{
    ctx.fillStyle='#030906';
    ctx.fillRect(x-w*.06,base-h*.25,w*.12,h*.25);
    for(let i=0;i<3;i++){const ty=base-h*(.25+i*.26),tw=w*(1-i*.22); ctx.beginPath(); ctx.moveTo(x-tw*.5,ty+h*.22); ctx.lineTo(x,ty); ctx.lineTo(x+tw*.5,ty+h*.22); ctx.closePath(); ctx.fill();}
  };
  const pos=[.04,.15,.24,.35,.45,.55,.65,.76,.87,.96];
  pos.forEach((tx,i)=>{ const h=H*(.28+((i*37)%20)/100); drawTree(tx*W,H*.65,h*.38,h); });
  // Tree glow
  ctx.save(); ctx.strokeStyle='rgba(82,212,72,.2)'; ctx.lineWidth=1; ctx.shadowColor='#52d448'; ctx.shadowBlur=5;
  pos.forEach((tx,i)=>{ const h=H*(.28+((i*37)%20)/100),x=tx*W,w=h*.38;
    ctx.beginPath(); ctx.moveTo(x-w*.5,H*.65-h*.25+h*.22); ctx.lineTo(x,H*.65-h); ctx.lineTo(x+w*.5,H*.65-h*.25+h*.22); ctx.stroke();
  }); ctx.restore();
  // Mist
  const mist=ctx.createLinearGradient(0,H*.6,0,H*.82);
  mist.addColorStop(0,'rgba(80,140,80,0)'); mist.addColorStop(.4,'rgba(60,110,65,.1)'); mist.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=mist; ctx.fillRect(0,H*.6,W,H*.4);
  // Fireflies
  for(let i=0;i<22;i++){
    const x=((i*1664525+1013904223)%65536)/65536*W, y=H*.5+((i*22695477+1)%65536)/65536*H*.22;
    ctx.globalAlpha=.2+(i%4)*.18; ctx.fillStyle='#c8a032'; ctx.shadowColor='#c8a032'; ctx.shadowBlur=5;
    ctx.beginPath(); ctx.arc(x,y,.8+(i%3)*.4,0,Math.PI*2); ctx.fill();
  } ctx.globalAlpha=1; ctx.shadowBlur=0;
  // Vignette
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.1,W/2,H/2,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

function drawArtCyber(canvas) {
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  const sky=ctx.createLinearGradient(0,0,0,H*.55);
  sky.addColorStop(0,'#07030f'); sky.addColorStop(.6,'#100520'); sky.addColorStop(1,'#160830');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*.55);
  const gnd=ctx.createLinearGradient(0,H*.55,0,H);
  gnd.addColorStop(0,'#0c051a'); gnd.addColorStop(1,'#040208');
  ctx.fillStyle=gnd; ctx.fillRect(0,H*.55,W,H*.45);
  // Stars
  for(let i=0;i<40;i++){
    const x=((i*2654435761+555)%65536)/65536*W, y=((i*1013904223+777)%65536)/65536*H*.45;
    ctx.globalAlpha=.15+(i%3)*.18; ctx.fillStyle='#c060ff';
    ctx.beginPath(); ctx.arc(x,y,.5,0,Math.PI*2); ctx.fill();
  } ctx.globalAlpha=1;
  // City silhouettes
  const bldgs=[[0,.55,.12,.25],[.1,.55,.08,.35],[.16,.55,.1,.3],[.24,.55,.07,.18],[.29,.55,.12,.42],[.39,.55,.06,.28],[.43,.55,.09,.22],[.5,.55,.05,.38],[.53,.55,.1,.48],[.61,.55,.08,.3],[.67,.55,.06,.2],[.71,.55,.11,.36],[.80,.55,.07,.27],[.85,.55,.1,.22],[.93,.55,.07,.32]];
  ctx.fillStyle='#050210';
  bldgs.forEach(([x,y,w,h])=>ctx.fillRect(x*W,(y-h)*H,w*W,h*H));
  // Neon signs
  ctx.save();
  bldgs.forEach(([x,y,w,h],i)=>{
    if(i%3!==0)return;
    const c=i%2===0?'#c060ff':'#00e5ff';
    ctx.strokeStyle=c; ctx.lineWidth=1.5; ctx.shadowColor=c; ctx.shadowBlur=7; ctx.globalAlpha=.65;
    ctx.strokeRect((x+.01)*W,(y-h+.03)*H,(w-.02)*W,.04*H);
  }); ctx.restore();
  // Edge glow
  ctx.save(); ctx.lineWidth=1;
  bldgs.forEach(([x,y,w,h],i)=>{
    const c=i%3===0?'#c060ff':i%3===1?'#00e5ff':'#ff3f82';
    ctx.strokeStyle=c; ctx.shadowColor=c; ctx.shadowBlur=4; ctx.globalAlpha=.28;
    ctx.beginPath(); ctx.moveTo(x*W,y*H); ctx.lineTo(x*W,(y-h)*H); ctx.lineTo((x+w)*W,(y-h)*H); ctx.lineTo((x+w)*W,y*H); ctx.stroke();
  }); ctx.globalAlpha=1; ctx.restore();
  // Reflection
  const rf=ctx.createLinearGradient(0,H*.55,0,H*.78);
  rf.addColorStop(0,'rgba(192,96,255,.14)'); rf.addColorStop(.5,'rgba(0,229,255,.06)'); rf.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rf; ctx.fillRect(0,H*.55,W,H*.45);
  // Horizon glow
  ctx.strokeStyle='rgba(192,96,255,.55)'; ctx.lineWidth=1; ctx.shadowColor='#c060ff'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(0,H*.55); ctx.lineTo(W,H*.55); ctx.stroke(); ctx.shadowBlur=0;
  // Rain
  ctx.globalAlpha=.17; ctx.strokeStyle='#8070c0'; ctx.lineWidth=.7;
  for(let i=0;i<70;i++){
    const rx=((i*2654435761+999)%65536)/65536*W, ry=((i*1013904223+111)%65536)/65536*H, rl=5+(i%5)*3;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-1,ry+rl); ctx.stroke();
  } ctx.globalAlpha=1;
  // Scanlines
  ctx.fillStyle='rgba(0,0,0,.12)';
  for(let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  // Vignette
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.1,W/2,H/2,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.7)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}

  document.getElementById('grid-wrap').classList.add('win-reveal');
